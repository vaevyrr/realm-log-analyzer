name: Windows GUI release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build GUI executable
        run: pyinstaller --onefile --windowed --name realm-log-analyzer-windows-x64 gui.py

      - name: Verify GUI executable
        shell: pwsh
        run: |
          $exe = "dist/realm-log-analyzer-windows-x64.exe"
          if (-not (Test-Path $exe)) {
            throw "Executable was not created."
          }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "GUI process exited immediately with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force

      - name: Create checksums
        shell: pwsh
        run: |
          (Get-FileHash "dist/realm-log-analyzer-windows-x64.exe" -Algorithm SHA256).Hash + "  realm-log-analyzer-windows-x64.exe" | Out-File dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: realm-log-analyzer-windows-x64
          path: |
            dist/realm-log-analyzer-windows-x64.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: realm-log-analyzer-windows-x64 v0.1.${{ github.run_number }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/realm-log-analyzer-windows-x64.exe
            dist/SHA256SUMS.txt